<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFT Comp Analyzer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="fetch-error-banner" class="banner banner-error" hidden></div>
<div id="selftest-banner" class="banner banner-error" hidden></div>

<header class="site-header">
  <div class="logo">
    <!-- Logo görseli — set verisi değil, sabit bir marka öğesi (bkz.
         SPEC-WEB.md section 5.0). alt="" kasıtlı: bitişikteki h1 zaten
         aynı ismi taşıyor, ekran okuyucu ikisini art arda okumasın. -->
    <img class="logo-icon" src="logo.png" alt="">
    <h1>TFT Comp Analyzer</h1>
  </div>
</header>

<div class="layout-grid">

  <aside id="suggestions-column" class="side-column">
    <details id="suggestions-panel" class="collapsible-panel" open>
      <summary>Önerilen Comp'lar</summary>
      <div id="suggestions-list" class="suggestions-list"></div>
    </details>
  </aside>

  <section id="board-column" class="board-column" aria-labelledby="board-heading">
    <h2 id="board-heading">Board</h2>
    <div id="board-toast-container"></div>
    <div id="board-slots" class="board-slots"></div>
    <div id="active-traits" class="active-traits-panel"></div>
  </section>

</div>

<!-- section 5.5: sonuç paneli artık ızgaranın parçası değil, sağdan kayan
     bir overlay. Sekme panelin İÇİNDE (ilk çocuk) — böylece translateX ile
     panelle birlikte kayar, ayrı bir konum senkronizasyonu gerekmez. Scroll
     eden içerik ayrı bir iç wrapper'da (.result-panel-scroll): dış konteyner
     overflow:visible kalmalı, yoksa CSS'in "overflow-y ayarlanınca
     overflow-x da auto olur" kuralı sekmeyi (left:-28px ile dışarı taşan)
     kırpar. -->
<aside id="result-panel" class="result-panel" aria-labelledby="result-heading">
  <button type="button" id="result-toggle" class="result-toggle" aria-expanded="false" aria-controls="result-panel">‹</button>
  <div class="result-panel-scroll">
    <h2 id="result-heading">Sonuç</h2>
    <div id="result-content">
      <p class="empty-state">Board'a en az 4 unit ekleyince eşleşen comp burada görünecek.</p>
    </div>
  </div>
</aside>

<!-- section 8 (2026-08-31): head-to-head'deki comp isimlerine tıklayınca
     açılan modal — o comp'un tam raporunu board'a dokunmadan gösterir.
     Zincirleme gezinme: modal içindeki head-to-head isimleri de aynı modalın
     içeriğini değiştirir, yeni modal açmaz. -->
<div id="comp-modal-overlay" class="comp-modal-overlay" hidden>
  <div id="comp-modal" class="comp-modal" role="dialog" aria-modal="true" aria-labelledby="comp-modal-heading">
    <button type="button" id="comp-modal-close" class="comp-modal-close" aria-label="Kapat">×</button>
    <div id="comp-modal-content"></div>
  </div>
</div>

<div id="palette-panel" class="palette-panel">
  <div class="palette-panel-header">
    <span class="palette-panel-title">Unit Paleti</span>
    <div class="palette-controls">
      <input type="search" id="palette-search" placeholder="Unit ara... (tüm maliyetlerde arar)">
      <select id="palette-trait-filter">
        <option value="">Tüm trait'ler</option>
      </select>
    </div>
    <button type="button" id="palette-toggle" class="palette-toggle">Genişlet ▾</button>
  </div>
  <div class="palette-body">
    <div id="cost-tabs" class="cost-tabs">
      <button type="button" class="cost-tab cost-1" data-cost="1">1</button>
      <button type="button" class="cost-tab cost-2" data-cost="2">2</button>
      <button type="button" class="cost-tab cost-3" data-cost="3">3</button>
      <button type="button" class="cost-tab cost-4" data-cost="4">4</button>
      <button type="button" class="cost-tab cost-5" data-cost="5">5</button>
    </div>
    <div id="palette-grid" class="palette-grid"></div>
  </div>
</div>

<details id="constraints-box" class="constraints-box" open>
  <summary>Kısıtlar</summary>
  <ul id="constraints-list"></ul>
</details>

<footer class="site-footer">
  <p>Bu proje Riot Games ile ilişkili değildir ve Riot tarafından onaylanmamıştır.</p>
</footer>

<script src="app.js" defer></script>
</body>
</html>
